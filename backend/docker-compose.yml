services:
  mysql:
    image: mysql:8.0
    container_name: cloudnotes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: cloudnotes
      MYSQL_USER: cloudnotes
      MYSQL_PASSWORD: cloudnotes123
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build: .
    container_name: cloudnotes-backend
    ports:
      - "8004:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+asyncmy://cloudnotes:cloudnotes123@mysql:3306/cloudnotes
      SECRET_KEY: cloud-notes-secret-key-change-in-production
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
